name: Release

# Push a tag matching package.json's version (e.g. v1.2.0) to create a GitHub
# release with the store zips and submit them to the stores. Store
# submission for each store is skipped until its secrets are configured.
# Run manually with dry_run to validate store credentials.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate store credentials without submitting
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
      CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
      CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
      FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
      FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
      FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check tag matches package.json version
        if: github.event_name == 'push'
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
      - run: npm run compile
      - run: npm test
      - run: npm run zip
      - run: npm run zip:firefox

      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes .output/*.zip

      - name: Submit to Chrome Web Store
        if: env.CHROME_REFRESH_TOKEN != ''
        run: npx wxt submit $DRY_RUN --chrome-zip .output/*-chrome.zip

      - name: Submit to Firefox Add-ons
        if: env.FIREFOX_JWT_SECRET != ''
        run: npx wxt submit $DRY_RUN --firefox-zip .output/*-firefox.zip --firefox-sources-zip .output/*-sources.zip
