<!DOCTYPE html>

<html>
<head>
    <meta charset="utf-8" />
    <title>.torrent to Transmission</title>
    <script type="module" src="./main.ts"></script>
</head>
<body>
    <div class="transmission-error" hidden>
        Unable to contact Transmission server <span class="rpc-url"></span>
        (<span class="error-reason"></span>)
        <br /><button type="button" class="grant-access" hidden>Allow access to <span class="grant-host"></span></button>
        <br /><a href="#" class="open-options">go to the options page</a>
    </div>
    <div class="main">
        <div class="button wrapper pause all" title="Pause all torrents"><div></div>Pause All</div>
        <div class="button wrapper resume all" title="Resume all torrents"><div></div>Resume All</div>
        <div class="clear"></div>
        <div class="navitem" data-list="all">All</div>
        <div class="navitem" data-list="download">Downloading</div>
        <div class="navitem" data-list="seed">Seeding</div>
        <div class="navitem" data-list="pause">Paused</div>
        <div class="clear"></div>
        <div class="list-wrapper"></div>
        <div class="bottom navbar">
            &nbsp;
            <div class="link-wrapper">
                <a target="_blank" class="button wrapper webui">WebUI</a>
            </div>
            <img class="turtle off" alt="" title="Toggle alternative speed limits" />
            <div class="stats-wrapper"></div>
        </div>
    </div>
</body>
</html>
